<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Laporan Sales</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system,'Segoe UI',Roboto,sans-serif; }
  body { background:#f0f2f5; color:#1a1a1a; padding-bottom:30px; }
  .header { background:linear-gradient(135deg,#1e6fdb,#0d47a1); color:#fff; padding:16px; position:sticky; top:0; z-index:100; }
  .header h1 { font-size:18px; }
  .header small { opacity:.85; font-size:12px; }
  .container { padding:16px; max-width:600px; margin:0 auto; }
  .card { background:#fff; border-radius:14px; padding:16px; margin-bottom:14px; box-shadow:0 1px 4px rgba(0,0,0,.08); }
  .card h2 { font-size:16px; margin-bottom:12px; color:#0d47a1; }
  label { display:block; font-size:13px; font-weight:600; margin:10px 0 4px; color:#444; }
  input, select { width:100%; padding:12px; border:1.5px solid #ddd; border-radius:10px; font-size:15px; background:#fafafa; }
  button { width:100%; padding:14px; border:none; border-radius:10px; font-size:15px; font-weight:700; cursor:pointer; margin-top:10px; }
  .btn-primary { background:linear-gradient(135deg,#1e6fdb,#0d47a1); color:#fff; }
  .btn-green { background:#0a8f4d; color:#fff; }
  .btn-red { background:#c0392b; color:#fff; }
  .btn-gray { background:#eee; color:#333; }
  .btn-orange { background:#e67e22; color:#fff; }
  .btn-sm { width:auto; padding:8px 14px; font-size:13px; margin:0; }
  .btn-row { display:flex; gap:8px; }
  .btn-row button { flex:1; }
  .hidden { display:none !important; }
  .photo-preview { width:100%; border-radius:10px; margin-top:10px; max-height:220px; object-fit:cover; }
  video, canvas { width:100%; border-radius:10px; }
  .info-row { display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid #eee; font-size:14px; }
  .divider { height:1px; background:#eee; margin:12px 0; }
  .product-row { display:grid; grid-template-columns:1.6fr 0.7fr 1.2fr 1.1fr auto; gap:4px; margin-bottom:8px; align-items:center; }
  .product-row input, .product-row select { padding:8px 5px; font-size:12px; }
  .product-row button { padding:8px; font-size:14px; width:auto; margin:0; }
  .toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#333; color:#fff; padding:12px 20px; border-radius:30px; font-size:14px; z-index:999; opacity:0; transition:.3s; pointer-events:none; max-width:90%; text-align:center; }
  .toast.show { opacity:1; bottom:30px; }
</style>
</head>
<body>
<div class="header"><h1>📱 Laporan Sales</h1><small id="headerSub"></small></div>
<div class="container">
  <div class="card hidden" id="activeVisitCard">
    <h2>🏪 Kunjungan Aktif</h2>
    <div class="info-row"><span>Toko</span><b id="av_toko">-</b></div>
    <div class="info-row"><span>Jam Masuk</span><b id="av_masuk">-</b></div>
    <div class="info-row"><span>Durasi</span><b id="av_durasi">-</b></div>
    <div class="info-row"><span>Total Order</span><b id="av_order">Rp 0</b></div>
    <div class="divider"></div>
    <button class="btn-green" onclick="showOrderForm()">🛒 Input Orderan</button>
    <button class="btn-red" onclick="selesaiKunjungan()" style="margin-top:16px;">✅ SELESAI & KIRIM KE KANTOR</button>
  </div>
  
  <div class="card" id="checkinCard">
    <h2>🟢 Check-in Kunjungan Toko</h2>
    <label>🏪 Pilih Nama Toko</label>
    <select id="ci_toko"><option value="">⏳ Memuat daftar toko...</option></select>
    <label>📍 Lokasi Koordinat GPS</label>
    <input type="text" id="ci_lokasi" placeholder="Tekan tombol GPS di bawah" readonly>
    <div class="btn-row" style="margin-top:6px;">
      <button class="btn-gray btn-sm" onclick="getGPS()">📍 Ambil GPS & Deteksi</button>
      <button class="btn-orange btn-sm" onclick="pakaiTokoManual()">✏️ Ambil GPS Manual</button>
    </div>
    <label>📸 Foto Selfie di Toko (wajib)</label>
    <button class="btn-gray" onclick="openCamera()" id="btnOpenCam">📷 Buka Kamera</button>
    <video id="video" autoplay playsinline class="hidden"></video>
    <canvas id="canvas" class="hidden"></canvas>
    <img id="selfiePreview" class="photo-preview hidden">
    <div id="camControls" class="hidden">
      <div class="btn-row">
        <button class="btn-green" onclick="capturePhoto()">📸 Ambil Foto</button>
        <button class="btn-red" onclick="closeCamera()">✖ Batal</button>
      </div>
    </div>
    <label>🕐 Jam Masuk</label>
    <input type="text" id="ci_jam" readonly>
    <button class="btn-primary" style="padding:20px;font-size:17px;" onclick="checkIn()">✅ SIMPAN CHECK-IN</button>
  </div>
  
  <div class="card hidden" id="orderCard">
    <h2>🛒 Input Orderan</h2>
    <div id="productList"></div>
    <button class="btn-gray btn-sm" onclick="addProductRow()">+ Tambah Produk</button>
    <div class="divider"></div>
    <div class="info-row"><span>Total Order</span><b id="orderTotal">Rp 0</b></div>
    <button class="btn-green" onclick="saveOrder()">💾 Simpan Orderan</button>
    <button class="btn-gray" onclick="hideForms()">⬅ Kembali</button>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbxn3J0Ol-11WWUy4WsMCs5E1t1K9Qsb6nBE8KIaZJ0wLxrZGrN6CaQIJzjnAwVsXyHL/exec';
const NOMOR_WA_ADMIN = '6289657160578';

let DAFTAR_TOKO = [], currentVisit = null, selfieData = null, mediaStream = null, gpsData = null, orders = [];
let latData = '', lngData = '', alamatData = '-';

function terjemahkanAlamat(lat, lng) {
  return new Promise((resolve) => {
    window.terimaAlamat = function(data) {
      if (data && data.alamat) {
        alamatData = data.alamat.replace(/,\s*Indonesia$/i, '').trim();
      } else {
        alamatData = `Koordinat: ${lat}, ${lng}`;
      }
      const script = document.getElementById('jsonp-alamat');
      if(script) script.remove();
      resolve();
    };
    const script = document.createElement('script');
    script.id = 'jsonp-alamat';
    script.src = `${API_URL}?action=geocode&lat=${lat}&lng=${lng}&callback=terimaAlamat&t=${new Date().getTime()}`;
    document.body.appendChild(script);
    setTimeout(() => { if (alamatData.startsWith('Koordinat:')) resolve(); }, 4000);
  });
}

window.onload = async function() {
  document.getElementById('ci_jam').value = nowStr();
  document.getElementById('headerSub').textContent = new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  loadDaftarToko();
};

function loadDaftarToko() {
  const selectToko = document.getElementById('ci_toko');
  selectToko.innerHTML = '<option value="">⏳ Memuat data toko...</option>';
  
  window.terimaDataToko = function(data) {
    try {
      if (data.result === 'success' && data.toko) {
        DAFTAR_TOKO = data.toko;
        selectToko.innerHTML = '<option value="">-- Pilih Toko dari Daftar --</option>';
        DAFTAR_TOKO.forEach(t => {
          let opt = document.createElement('option');
          opt.value = t.nama; opt.textContent = t.nama;
          selectToko.appendChild(opt);
        });
        toast('✅ ' + DAFTAR_TOKO.length + ' toko dimuat');
      } else {
        selectToko.innerHTML = '<option value="">(Gagal memuat data)</option>';
      }
    } catch(e) {
      selectToko.innerHTML = '<option value="">(Error parsing data)</option>';
    }
    const script = document.getElementById('jsonp-toko');
    if(script) script.remove();
  };

  const script = document.createElement('script');
  script.id = 'jsonp-toko';
  script.src = API_URL + '?callback=terimaDataToko&t=' + new Date().getTime();
  document.body.appendChild(script);
}

function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 3000); }
function nowStr(){ return new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function rupiah(n){ return 'Rp ' + (n||0).toLocaleString('id-ID'); }

function hitungJarakMeter(lat1, lon1, lat2, lon2) {
  const R = 6371e3, dLat = (lat2 - lat1) * Math.PI / 180, dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2)**2;
  return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
}

function getGPS(){
  if(!navigator.geolocation){ toast('GPS tidak didukung'); return; }
  document.getElementById('ci_lokasi').value = 'Mendeteksi posisi & alamat...';
  navigator.geolocation.getCurrentPosition(async (pos)=>{
    const userLat = pos.coords.latitude, userLng = pos.coords.longitude;
    latData = userLat.toFixed(6);
    lngData = userLng.toFixed(6);
    gpsData = latData + ',' + lngData;
    document.getElementById('ci_lokasi').value = gpsData;
    await terjemahkanAlamat(latData, lngData);

    let tokoTerdekat = "", jarakTerpendek = 999999;
    DAFTAR_TOKO.forEach(toko => {
      let jarak = hitungJarakMeter(userLat, userLng, toko.lat, toko.lng);
      if(jarak < jarakTerpendek){ jarakTerpendek = jarak; tokoTerdekat = toko.nama; }
    });
    if(jarakTerpendek <= 500){ document.getElementById('ci_toko').value = tokoTerdekat; toast('✅ Toko: ' + tokoTerdekat); }
    else { toast('⚠️ Di luar radius (~' + Math.round(jarakTerpendek) + 'm)'); }
  }, ()=>{ document.getElementById('ci_lokasi').value = 'Gagal ambil GPS'; }, { enableHighAccuracy: true, timeout: 10000 });
}

function pakaiTokoManual(){
  if(!navigator.geolocation) return;
  document.getElementById('ci_lokasi').value = 'Mengambil koordinat & alamat...';
  navigator.geolocation.getCurrentPosition(async (pos)=>{
    latData = pos.coords.latitude.toFixed(6);
    lngData = pos.coords.longitude.toFixed(6);
    gpsData = latData + ',' + lngData;
    document.getElementById('ci_lokasi').value = gpsData;
    await terjemahkanAlamat(latData, lngData);
    toast('✅ Koordinat & alamat diambil');
  }, ()=>{ document.getElementById('ci_lokasi').value = 'Gagal ambil GPS'; }, { enableHighAccuracy: true, timeout: 10000 });
}

async function openCamera(){
  try{
    mediaStream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:'user' } });
    const v = document.getElementById('video');
    v.srcObject = mediaStream; v.classList.remove('hidden');
    document.getElementById('camControls').classList.remove('hidden');
    document.getElementById('btnOpenCam').classList.add('hidden');
    document.getElementById('selfiePreview').classList.add('hidden');
  }catch(e){ toast('❌ Kamera error: ' + e.message); }
}

async function capturePhoto(){
  if (!latData || !lngData) {
    toast('⏳ Mengambil GPS...');
    await new Promise((resolve) => {
      navigator.geolocation.getCurrentPosition((pos) => {
        latData = pos.coords.latitude.toFixed(6);
        lngData = pos.coords.longitude.toFixed(6);
        gpsData = latData + ',' + lngData;
        document.getElementById('ci_lokasi').value = gpsData;
        resolve();
      }, () => resolve(), { enableHighAccuracy: true, timeout: 10000 });
    });
  }
  if (!latData || !lngData) { toast('❌ GPS gagal'); return; }

  toast('⏳ Menerjemahkan alamat...');
  await terjemahkanAlamat(latData, lngData);

  const v = document.getElementById('video'), c = document.getElementById('canvas');
  c.width = v.videoWidth || 720;
  c.height = v.videoHeight || 960;
  const ctx = c.getContext('2d');
  ctx.drawImage(v, 0, 0, c.width, c.height);

  const boxHeight = 195;
  ctx.fillStyle = 'rgba(0,0,0,0.75)';
  ctx.fillRect(0, c.height - boxHeight, c.width, boxHeight);
  ctx.fillStyle = '#FFC107';
  ctx.fillRect(14, c.height - boxHeight + 14, 5, boxHeight - 28);

  const namaToko = document.getElementById('ci_toko').value || '-';
  const tgl = new Date().toLocaleDateString('id-ID',{weekday:'long',day:'2-digit',month:'2-digit',year:'numeric'});
  const startX = 30;
  let y = c.height - boxHeight + 35;

  ctx.fillStyle = '#FFC107';
  ctx.font = 'bold 18px sans-serif';
  ctx.fillText('📍 ' + namaToko.toUpperCase(), startX, y);

  y += 25;
  ctx.fillStyle = '#FFFFFF';
  ctx.font = 'bold 14px sans-serif';
  ctx.fillText(tgl + ' • ' + nowStr() + ' WIB', startX, y);

  y += 22;
  ctx.fillStyle = '#FFFFFF';
  ctx.font = '13px sans-serif';
  const alamat = alamatData || '-';
  const maxChar = 46;
  const b1 = alamat.slice(0, maxChar);
  const b2 = alamat.slice(maxChar, maxChar * 2);
  ctx.fillText(b1, startX, y);
  if (b2) { y += 18; ctx.fillText(b2, startX, y); }

  y += 22;
  ctx.fillStyle = '#A5D6A7';
  ctx.font = 'bold 12px monospace';
  ctx.fillText('GPS: ' + gpsData, startX, y);

  selfieData = c.toDataURL('image/jpeg', 0.78);
  const p = document.getElementById('selfiePreview');
  p.src = selfieData; p.classList.remove('hidden');
  closeCamera();
  toast('📸 Foto + alamat tersimpan');
}

function closeCamera(){
  if(mediaStream){ mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }
  document.getElementById('video').classList.add('hidden');
  document.getElementById('camControls').classList.add('hidden');
  document.getElementById('btnOpenCam').classList.remove('hidden');
}

function checkIn(){
  const toko = document.getElementById('ci_toko').value;
  if(!toko){ toast('⚠️ Pilih nama toko'); return; }
  if(!selfieData){ toast('⚠️ Foto selfie wajib'); return; }
  currentVisit = { 
    tanggal: todayStr(), 
    toko: toko, 
    lokasi: document.getElementById('ci_lokasi').value || '-', 
    lat: latData,
    lng: lngData,
    alamat: alamatData,
    jamMasuk: nowStr(), 
    selfie: selfieData 
  };
  orders = []; selfieData = null; latData = ''; lngData = ''; alamatData = '-';
  document.getElementById('checkinCard').classList.add('hidden');
  document.getElementById('activeVisitCard').classList.remove('hidden');
  document.getElementById('av_toko').textContent = currentVisit.toko;
  document.getElementById('av_masuk').textContent = currentVisit.jamMasuk;
  document.getElementById('av_order').textContent = 'Rp 0';
  document.getElementById('ci_lokasi').value = '';
  document.getElementById('selfiePreview').classList.add('hidden');
  toast('✅ Check-in berhasil');
}

function showOrderForm(){
  document.getElementById('orderCard').classList.remove('hidden');
  document.getElementById('activeVisitCard').classList.add('hidden');
  document.getElementById('productList').innerHTML = '';
  document.getElementById('orderTotal').textContent = 'Rp 0';
  addProductRow();
}

function hideForms(){
  document.getElementById('orderCard').classList.add('hidden');
  document.getElementById('activeVisitCard').classList.remove('hidden');
}

function addProductRow(){
  const div = document.createElement('div'); div.className = 'product-row';
  div.innerHTML = '<input placeholder="Produk" class="p-nama"><input type="number" placeholder="Qty" class="p-qty" min="1" value="1" oninput="calcTotal()"><select class="p-satuan"><option value="Krg">Krg</option><option value="Jrg">Jrg</option><option value="Bal">Bal</option><option value="Dus">Dus</option><option value="Kg">Kg</option></select><input type="number" placeholder="Harga" class="p-harga" min="0" value="0" oninput="calcTotal()"><button class="btn-red btn-sm" onclick="this.parentElement.remove();calcTotal()">✖</button>';
  document.getElementById('productList').appendChild(div);
}

function calcTotal(){
  let total = 0;
  document.querySelectorAll('.product-row').forEach(r => { total += (+r.querySelector('.p-qty').value || 0) * (+r.querySelector('.p-harga').value || 0); });
  document.getElementById('orderTotal').textContent = rupiah(total);
}

function saveOrder(){
  const items = [];
  document.querySelectorAll('.product-row').forEach(r => {
    const nama = r.querySelector('.p-nama').value.trim(), qty = +r.querySelector('.p-qty').value || 0, satuan = r.querySelector('.p-satuan').value, harga = +r.querySelector('.p-harga').value || 0;
    if(nama && qty > 0) items.push({nama, qty, satuan, harga, subtotal: qty * harga});
  });
  if(!items.length){ toast('⚠️ Tambah minimal 1 produk'); return; }
  orders = orders.concat(items);
  const total = orders.reduce((s,i) => s + i.subtotal, 0);
  document.getElementById('av_order').textContent = rupiah(total);
  toast('✅ Orderan ditambah'); hideForms();
}

// =========================================================
// INI BAGIAN YANG DIPERBAIKI: KIRIM VIA IFRAME TERSEMBUNYI
// =========================================================
async function selesaiKunjungan(){
  if(!currentVisit || !confirm('Kirim laporan ke kantor & WA?')) return;
  
  const totalOrder = orders.reduce((s,i) => s + i.subtotal, 0), jamKeluar = nowStr();
  let teksPesanan = orders.length > 0 ? orders.map((item, idx) => (idx + 1) + '. ' + item.nama + ' | ' + item.qty + ' ' + item.satuan + ' @ ' + rupiah(item.harga) + ' = ' + rupiah(item.subtotal)).join('\n') : '-';
  const linkMaps = (currentVisit.lat && currentVisit.lng) ? `https://www.google.com/maps?q=${currentVisit.lat},${currentVisit.lng}` : '-';

  toast('⏳ Mengirim data ke Google...');

  // 1. Buat iframe tersembunyi
  let iframe = document.getElementById('iframe_kirim');
  if (!iframe) {
    iframe = document.createElement('iframe');
    iframe.name = 'iframe_kirim';
    iframe.id = 'iframe_kirim';
    iframe.style.display = 'none';
    document.body.appendChild(iframe);
  }

  // 2. Buat form
  const form = document.createElement('form');
  form.method = 'POST';
  form.action = API_URL;
  form.target = 'iframe_kirim'; 
  form.style.display = 'none';

  const dataKirim = {
    action: 'simpan', 
    tanggal: currentVisit.tanggal,
    toko: currentVisit.toko,
    jamMasuk: currentVisit.jamMasuk,
    jamKeluar: jamKeluar,
    totalOrder: totalOrder.toString(),
    foto: currentVisit.selfie || '',
    pesanan: teksPesanan,
    lat: currentVisit.lat || '',
    lng: currentVisit.lng || '',
    alamat: currentVisit.alamat || '-'
  };

  for (const key in dataKirim) {
    const input = document.createElement('input');
    input.type = 'hidden';
    input.name = key;
    input.value = dataKirim[key];
    form.appendChild(input);
  }

  document.body.appendChild(form);
  form.submit();

  // 3. Tunggu 4 detik, lalu buka WA langsung
  setTimeout(() => {
    // Karena tidak membaca balasan dari Google, link foto tidak disertakan di WA.
    let pesanWA = '*LAPORAN KUNJUNGAN & ORDER*\n' +
                  'Tanggal : ' + currentVisit.tanggal + '\n' +
                  'Toko : *' + currentVisit.toko + '*\n' +
                  'Jam : ' + currentVisit.jamMasuk + ' - ' + jamKeluar + '\n' +
                  '📍 Alamat : ' + currentVisit.alamat + '\n' +
                  '🗺️ Link GPS : ' + linkMaps + '\n' +
                  '--------------------------\n' +
                  '*ORDERAN:*\n' + teksPesanan + '\n' +
                  '--------------------------\n' +
                  '*Total : ' + rupiah(totalOrder) + '*\n\n' +
                  '_(Foto selfie & file order sudah tersimpan di Drive/Sheets)_';

    // Tembak langsung ke WA
    const linkWA = 'https://wa.me/6289657160578?text=' + encodeURIComponent(pesanWA);

    // Reset aplikasi
    currentVisit = null; 
    orders = [];
    document.getElementById('activeVisitCard').classList.add('hidden');
    document.getElementById('checkinCard').classList.remove('hidden');
    document.getElementById('ci_lokasi').value = '';
    document.getElementById('selfiePreview').classList.add('hidden');
    form.remove();

    toast('✅ Membuka WhatsApp...');
    window.location.href = linkWA; // Pindah ke WA tanpa buka tab baru

  }, 4000); // 4000 ms = 4 detik (waktu untuk Google memproses foto)
}
</script>
</body>
</html>
