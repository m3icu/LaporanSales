<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Laporan Sales</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system,'Segoe UI',Roboto,sans-serif; }
  body { background:#f0f2f5; color:#1a1a1a; padding-bottom:30px; }
  .header { background:linear-gradient(135deg,#1e6fdb,#0d47a1); color:#fff; padding:16px; position:sticky; top:0; z-index:100; box-shadow:0 2px 8px rgba(0,0,0,.2); }
  .header h1 { font-size:18px; }
  .header small { opacity:.85; font-size:12px; }
  .container { padding:16px; max-width:600px; margin:0 auto; }
  .card { background:#fff; border-radius:14px; padding:16px; margin-bottom:14px; box-shadow:0 1px 4px rgba(0,0,0,.08); }
  .card h2 { font-size:16px; margin-bottom:12px; color:#0d47a1; }
  label { display:block; font-size:13px; font-weight:600; margin:10px 0 4px; color:#444; }
  input, select, textarea { width:100%; padding:12px; border:1.5px solid #ddd; border-radius:10px; font-size:15px; background:#fafafa; }
  input:focus, select:focus, textarea:focus { outline:none; border-color:#1e6fdb; background:#fff; }
  button { width:100%; padding:14px; border:none; border-radius:10px; font-size:15px; font-weight:700; cursor:pointer; margin-top:10px; transition:.2s; }
  .btn-primary { background:linear-gradient(135deg,#1e6fdb,#0d47a1); color:#fff; }
  .btn-primary:active { transform:scale(.98); }
  .btn-green { background:#0a8f4d; color:#fff; }
  .btn-red { background:#c0392b; color:#fff; }
  .btn-gray { background:#eee; color:#333; }
  .btn-sm { width:auto; padding:8px 14px; font-size:13px; margin:0; }
  .btn-row { display:flex; gap:8px; }
  .btn-row button { flex:1; }
  .hidden { display:none !important; }
  .photo-preview { width:100%; border-radius:10px; margin-top:10px; max-height:220px; object-fit:cover; }
  video, canvas { width:100%; border-radius:10px; }
  .info-row { display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid #eee; font-size:14px; }
  .info-row:last-child { border:none; }
  .info-row b { color:#0d47a1; }
  .divider { height:1px; background:#eee; margin:12px 0; }
  .product-row { display:grid; grid-template-columns:2fr 1fr 1.2fr auto; gap:6px; margin-bottom:8px; align-items:center; }
  .product-row input { padding:8px; font-size:13px; }
  .product-row button { padding:8px; font-size:16px; width:auto; margin:0; }
  .toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#333; color:#fff; padding:12px 20px; border-radius:30px; font-size:14px; z-index:999; opacity:0; transition:.3s; pointer-events:none; max-width:90%; text-align:center; }
  .toast.show { opacity:1; bottom:30px; }
</style>
</head>
<body>

<div class="header">
  <h1>?? Laporan Sales</h1>
  <small id="headerSub"></small>
</div>

<div class="container">
  <div class="card hidden" id="activeVisitCard">
    <h2>?? Kunjungan Aktif</h2>
    <div class="info-row"><span>Toko</span><b id="av_toko">-</b></div>
    <div class="info-row"><span>Jam Masuk</span><b id="av_masuk">-</b></div>
    <div class="info-row"><span>Durasi</span><b id="av_durasi">-</b></div>
    <div class="divider"></div>
    <button class="btn-green" onclick="showOrderForm()">?? Input Orderan</button>
    <button class="btn-red" onclick="selesaiKunjungan()" style="margin-top:16px;">? SELESAI & KIRIM KE KANTOR</button>
  </div>

  <div class="card" id="checkinCard">
    <h2>?? Check-in Kunjungan Toko</h2>
    <label>?? Nama Toko (Otomatis dari Google Sheets)</label>
    <select id="ci_toko" style="width:100%; padding:12px; border:1.5px solid #ddd; border-radius:10px; font-size:15px; background:#fafafa; margin-bottom:10px;">
      <option value="">? Memuat daftar toko...</option>
    </select>

    <label>?? Lokasi Koordinat GPS</label>
    <input type="text" id="ci_lokasi" placeholder="Tekan tombol di bawah" readonly>
    <button class="btn-gray btn-sm" onclick="getGPS()" style="margin-top:6px;">?? Ambil Lokasi GPS & Deteksi Toko</button>

    <label>?? Foto Selfie di Toko (wajib)</label>
    <button class="btn-gray" onclick="openCamera()" id="btnOpenCam">?? Buka Kamera</button>
    <video id="video" autoplay playsinline class="hidden"></video>
    <canvas id="canvas" class="hidden"></canvas>
    <img id="selfiePreview" class="photo-preview hidden">
    <div id="camControls" class="hidden">
      <div class="btn-row">
        <button class="btn-green" onclick="capturePhoto()">?? Ambil Foto</button>
        <button class="btn-red" onclick="closeCamera()">? Batal</button>
      </div>
    </div>

    <label>?? Jam Masuk</label>
    <input type="text" id="ci_jam" readonly>

    <button class="btn-primary" style="padding:20px;font-size:17px;" onclick="checkIn()">? SIMPAN CHECK-IN</button>
  </div>

  <div class="card hidden" id="orderCard">
    <h2>?? Input Orderan</h2>
    <div id="productList"></div>
    <button class="btn-gray btn-sm" onclick="addProductRow()">+ Tambah Produk</button>
    <div class="divider"></div>
    <div class="info-row"><span>Total Order</span><b id="orderTotal">Rp 0</b></div>
    <button class="btn-green" onclick="saveOrder()">?? Simpan Orderan</button>
    <button class="btn-gray" onclick="hideForms()">? Kembali</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// URL WEB APP GOOGLE APPS SCRIPT ANDA
const API_URL = 'https://script.google.com/macros/s/AKfycbwSXvFAa0l1tkb7UVCyBomEiqeVz0RRbkvym6GGj0ilpaYNkGJhiPuTEGLpJPKyCaEP/exec';

let DAFTAR_TOKO = [];
let currentVisit = null;
let selfieData = null;
let mediaStream = null;
let gpsData = null;
let orders = [];

// Otomatis ambil daftar toko dari Google Sheets saat web dibuka
window.onload = async function() {
  document.getElementById('ci_jam').value = nowStr();
  document.getElementById('headerSub').textContent = new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  await loadDaftarToko();
};

async function loadDaftarToko() {
  const selectToko = document.getElementById('ci_toko');
  try {
    const response = await fetch(API_URL);
    const data = await response.json();
    
    if (data.result === 'success' && data.toko) {
      DAFTAR_TOKO = data.toko;
      selectToko.innerHTML = '<option value="">-- Pilih Toko / Tekan GPS --</option>';
      DAFTAR_TOKO.forEach(t => {
        let opt = document.createElement('option');
        opt.value = t.nama;
        opt.textContent = t.nama;
        selectToko.appendChild(opt);
      });
      toast('? ' + DAFTAR_TOKO.length + ' toko dimuat dari Sheets');
    } else {
      selectToko.innerHTML = '<option value="">? Gagal memuat toko</option>';
      toast('? ' + (data.message || 'Error muat toko'));
    }
  } catch (e) {
    selectToko.innerHTML = '<option value="">? Gagal terhubung ke server</option>';
    toast('? Koneksi gagal: ' + e.message);
  }
}

function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),3000); }
function nowStr(){ return new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function rupiah(n){ return 'Rp '+(n||0).toLocaleString('id-ID'); }

function hitungJarakMeter(lat1, lon1, lat2, lon2) {
  const R = 6371e3;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
            Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
            Math.sin(dLon/2) * Math.sin(dLon/2);
  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  return R * c;
}

function getGPS(){
  if(!navigator.geolocation){ toast('GPS tidak didukung'); return; }
  document.getElementById('ci_lokasi').value = 'Mendeteksi posisi...';
  
  navigator.geolocation.getCurrentPosition(
    (pos)=>{
      const userLat = pos.coords.latitude;
      const userLng = pos.coords.longitude;
      gpsData = userLat.toFixed(6) + ',' + userLng.toFixed(6);
      document.getElementById('ci_lokasi').value = gpsData;

      if (DAFTAR_TOKO.length === 0) {
        toast('?? Daftar toko belum dimuat');
        return;
      }

      let tokoTerdekat = "";
      let jarakTerpendek = 999999;

      DAFTAR_TOKO.forEach(toko => {
        let jarak = hitungJarakMeter(userLat, userLng, toko.lat, toko.lng);
        if(jarak < jarakTerpendek){
          jarakTerpendek = jarak;
          tokoTerdekat = toko.nama;
        }
      });

      // Toleransi radius 150 meter dari titik toko
      if(jarakTerpendek <= 150){
        document.getElementById('ci_toko').value = tokoTerdekat;
        toast('? Toko terdeteksi: ' + tokoTerdekat + ' (' + Math.round(jarakTerpendek) + 'm)');
      } else {
        toast('?? Di luar radius toko terdekat (~' + Math.round(jarakTerpendek) + 'm dari ' + tokoTerdekat + ')');
      }
    },
    (err)=>{ document.getElementById('ci_lokasi').value='Gagal ambil GPS'; toast('? GPS Error: '+err.message); },
    { enableHighAccuracy: true, timeout: 10000 }
  );
}

async function openCamera(){
  try{
    mediaStream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:'user' } });
    const v = document.getElementById('video');
    v.srcObject = mediaStream; v.classList.remove('hidden');
    document.getElementById('camControls').classList.remove('hidden');
    document.getElementById('btnOpenCam').classList.add('hidden');
    document.getElementById('selfiePreview').classList.add('hidden');
  }catch(e){ toast('? Kamera: '+e.message); }
}

function capturePhoto(){
  const v=document.getElementById('video'), c=document.getElementById('canvas');
  c.width=v.videoWidth; c.height=v.videoHeight;
  const ctx=c.getContext('2d');
  ctx.drawImage(v,0,0);
  
  ctx.fillStyle='rgba(0,0,0,.55)'; ctx.fillRect(0,c.height-70,c.width,70);
  ctx.fillStyle='#fff'; ctx.font='bold 18px sans-serif';
  const selectedToko = document.getElementById('ci_toko').value || 'Toko Lainnya';
  ctx.fillText('?? ' + selectedToko, 12, c.height-42);
  ctx.font='14px sans-serif';
  ctx.fillText('?? '+nowStr()+'  •  '+(gpsData||'-'), 12, c.height-18);
  
  selfieData = c.toDataURL('image/jpeg',0.7);
  const p=document.getElementById('selfiePreview'); p.src=selfieData; p.classList.remove('hidden');
  closeCamera(); toast('?? Foto & Watermark diambil');
}

function closeCamera(){
  if(mediaStream){ mediaStream.getTracks().forEach(t=>t.stop()); mediaStream=null; }
  document.getElementById('video').classList.add('hidden');
  document.getElementById('camControls').classList.add('hidden');
  document.getElementById('btnOpenCam').classList.remove('hidden');
}

function checkIn(){
  const toko=document.getElementById('ci_toko').value;
  if(!toko){ toast('?? Pilih atau deteksi toko dulu'); return; }
  if(!selfieData){ toast('?? Foto selfie wajib'); return; }

  currentVisit = {
    tanggal: todayStr(),
    toko: toko,
    lokasi: document.getElementById('ci_lokasi').value || '-',
    jamMasuk: nowStr(),
    selfie: selfieData
  };
  orders = [];
  selfieData = null;

  document.getElementById('checkinCard').classList.add('hidden');
  document.getElementById('activeVisitCard').classList.remove('hidden');
  document.getElementById('av_toko').textContent = currentVisit.toko;
  document.getElementById('av_masuk').textContent = currentVisit.jamMasuk;
  updateDurasi();
  setInterval(updateDurasi, 30000);

  document.getElementById('ci_lokasi').value='';
  document.getElementById('selfiePreview').classList.add('hidden');

  toast('? Check-in: '+currentVisit.toko);
}

function updateDurasi(){
  if(!currentVisit) return;
  const start = new Date(); start.setHours(...currentVisit.jamMasuk.split(':').map(Number),0);
  const diff = Math.floor((Date.now()-start.getTime())/60000);
  document.getElementById('av_durasi').textContent = diff+' menit';
}

function showOrderForm(){
  document.getElementById('orderCard').classList.remove('hidden');
  document.getElementById('activeVisitCard').classList.add('hidden');
  document.getElementById('productList').innerHTML='';
  addProductRow();
}

function hideForms(){
  document.getElementById('orderCard').classList.add('hidden');
  document.getElementById('activeVisitCard').classList.remove('hidden');
}

function addProductRow(){
  const div=document.createElement('div'); div.className='product-row';
  div.innerHTML = `
    <input placeholder="Produk" class="p-nama">
    <input type="number" placeholder="Qty" class="p-qty" min="1" value="1" oninput="calcTotal()">
    <input type="number" placeholder="Harga" class="p-harga" min="0" value="0" oninput="calcTotal()">
    <button class="btn-red btn-sm" onclick="this.parentElement.remove();calcTotal()">?</button>`;
  document.getElementById('productList').appendChild(div);
}

function calcTotal(){
  let total=0;
  document.querySelectorAll('.product-row').forEach(r=>{
    const q=+r.querySelector('.p-qty').value||0;
    const h=+r.querySelector('.p-harga').value||0;
    total+=q*h;
  });
  document.getElementById('orderTotal').textContent = rupiah(total);
}

function saveOrder(){
  const items=[];
  document.querySelectorAll('.product-row').forEach(r=>{
    const nama=r.querySelector('.p-nama').value.trim();
    const qty=+r.querySelector('.p-qty').value||0;
    const harga=+r.querySelector('.p-harga').value||0;
    if(nama && qty>0) items.push({nama,qty,harga,subtotal:qty*harga});
  });
  if(!items.length){ toast('?? Tambah minimal 1 produk'); return; }
  orders = orders.concat(items);
  const total = orders.reduce((s,i)=>s+i.subtotal,0);
  toast('? Orderan ditambah: '+rupiah(total));
  hideForms();
}

async function selesaiKunjungan(){
  if(!currentVisit) return;
  if(!confirm('Kirim laporan kunjungan ini ke kantor?')) return;

  const totalOrder = orders.reduce((s,i)=>s+i.subtotal,0);
  const jamKeluar = nowStr();

  const formData = new FormData();
  formData.append('tanggal', currentVisit.tanggal);
  formData.append('toko', currentVisit.toko);
  formData.append('jamMasuk', currentVisit.jamMasuk);
  formData.append('jamKeluar', jamKeluar);
  formData.append('totalOrder', totalOrder.toString());
  formData.append('foto', currentVisit.selfie || '');

  toast('? Mengirim ke kantor...');

  try {
    const response = await fetch(API_URL, { method: 'POST', body: formData });
    const result = await response.json();

    if(result.result === 'success'){
      toast('? Laporan terkirim ke kantor!');
      currentVisit = null;
      orders = [];
      document.getElementById('activeVisitCard').classList.add('hidden');
      document.getElementById('checkinCard').classList.remove('hidden');
    } else {
      toast('? Gagal: '+(result.message||'Unknown error'));
    }
  } catch(e){
    toast('? Error jaringan: '+e.message);
  }
}
</script>
</body>
</html>
